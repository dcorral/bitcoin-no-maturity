name: Build Artifacts
on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true
env:
  MAKEJOBS: '-j10'
defaults:
  run:
    shell: bash
jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 libevent-dev libboost-dev libsqlite3-dev libzmq3-dev qt6-base-dev qt6-tools-dev libqrencode-dev
      - name: Determine version
        id: version
        run: echo "VERSION=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          ./autogen.sh
          ./configure --disable-tests --disable-bench
          make $MAKEJOBS
      - name: Package artifact
        run: |
          mkdir -p bitcoin-${{ steps.version.outputs.VERSION }}-x86_64-linux-gnu/bin
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet bitcoin-${{ steps.version.outputs.VERSION }}-x86_64-linux-gnu/bin/
          tar -czf bitcoin-${{ steps.version.outputs.VERSION }}-x86_64-linux-gnu.tar.gz bitcoin-${{ steps.version.outputs.VERSION }}-x86_64-linux-gnu
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: bitcoin-${{ steps.version.outputs.VERSION }}-x86_64-linux-gnu.tar.gz

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          brew install automake libtool pkg-config python@3 boost libevent zeromq qt@6 qrencode
      - name: Determine version
        id: version
        run: echo "VERSION=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          ./autogen.sh
          ./configure --disable-tests --disable-bench --with-gui=qt6
          make $MAKEJOBS
      - name: Package artifact
        run: |
          mkdir -p bitcoin-${{ steps.version.outputs.VERSION }}-arm64-apple-darwin/bin
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet bitcoin-${{ steps.version.outputs.VERSION }}-arm64-apple-darwin/bin/
          tar -czf bitcoin-${{ steps.version.outputs.VERSION }}-arm64-apple-darwin.tar.gz bitcoin-${{ steps.version.outputs.VERSION }}-arm64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: bitcoin-${{ steps.version.outputs.VERSION }}-arm64-apple-darwin.tar.gz

