name: Build and Release Artifacts
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: true
env:
  MAKEJOBS: '-j10'
defaults:
  run:
    shell: bash
jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 libevent-dev libboost-dev libsqlite3-dev libzmq3-dev
      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --enable-wallet --disable-tests --disable-bench
          make $MAKEJOBS
      - name: Package artifact
        run: |
          mkdir -p bitcoin-${{ github.ref_name }}-x86_64-linux-gnu/bin
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet bitcoin-${{ github.ref_name }}-x86_64-linux-gnu/bin/
          tar -czf bitcoin-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz bitcoin-${{ github.ref_name }}-x86_64-linux-gnu
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: bitcoin-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          brew install automake libtool pkg-config python@3 boost libevent zeromq
      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --enable-wallet --disable-tests --disable-bench
          make $MAKEJOBS
      - name: Package artifact
        run: |
          mkdir -p bitcoin-${{ github.ref_name }}-arm64-apple-darwin/bin
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet bitcoin-${{ github.ref_name }}-arm64-apple-darwin/bin/
          tar -czf bitcoin-${{ github.ref_name }}-arm64-apple-darwin.tar.gz bitcoin-${{ github.ref_name }}-arm64-apple-darwin
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: bitcoin-${{ github.ref_name }}-arm64-apple-darwin.tar.gz

  release:
    name: Create Release and Upload Assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: artifacts/
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: artifacts/
      - name: Move artifacts to current directory
        run: |
          mv artifacts/* ./
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bitcoin-*.tar.gz
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

